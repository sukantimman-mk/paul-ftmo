name: 📡 Paul Pro V4 - Free Cloud H4 Scanner & Telegram Alert

on:
  schedule:
    # Runs 5 minutes after every H4 candle close (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    # Thai Time (UTC+7): 07:05, 11:05, 15:05, 19:05, 23:05, 03:05 (Every Day)
    - cron: '2,15 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      force_mode:
        description: 'Force send radar summary'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      - name: 📡 Run Paul Pro V4 H4 Scanner & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          FTMO_FIX_ACCOUNT: ${{ secrets.FTMO_FIX_ACCOUNT }}
          FTMO_FIX_SENDER: ${{ secrets.FTMO_FIX_SENDER }}
          FTMO_FIX_PASSWORD: ${{ secrets.FTMO_FIX_PASSWORD }}
          FTMO_FIX_HOST: ${{ secrets.FTMO_FIX_HOST }}
          FTMO_FIX_PORT: ${{ secrets.FTMO_FIX_PORT }}
        run: |
          python -u cot_updater.py || true
          python -u telegram_notifier.py --force

      - name: 💾 Save Updated Live Charts & Alert State to Cloud
        run: |
          git config user.name "Paul-FTMO-Cloud-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add forward_live_scanner.json paul_system_dashboard.html index.html cot_legacy_report.html cot_data.json cot_data.js cot_indices_all.json cot_historical_2023_2026.json telegram_alert_state.json forward_demo_ledger.json || true
          git diff --staged --quiet || git commit -m "🔄 Auto-update H4 Live Charts & Signals [skip ci]"
          git push || true
